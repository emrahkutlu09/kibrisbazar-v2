<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kıbrıs Bazar | Giriş Yap</title>
    
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="theme-color" content="#ffffff">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col items-center justify-center relative selection:bg-orange-500 selection:text-white">

    <!-- Tam Ekran Yükleyici (Giriş yapılırken veya yetki kontrol edilirken görünür) -->
    <div id="fullScreenLoader" class="fixed inset-0 bg-slate-900/80 z-[200] hidden flex-col items-center justify-center gap-4 backdrop-blur-sm">
        <i data-lucide="loader-2" class="w-12 h-12 text-orange-500 animate-spin"></i>
        <p class="text-white font-bold animate-pulse text-sm" id="loaderText">Sistem Kontrol Ediliyor...</p>
    </div>

    <!-- Geri Dön Butonu -->
    <div class="absolute top-6 left-6 sm:top-8 sm:left-8">
        <a href="index.html" class="flex items-center gap-2 text-slate-500 hover:text-orange-500 transition font-bold text-sm bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Pazaryerine Dön
        </a>
    </div>

    <!-- Giriş Kartı -->
    <div class="bg-white p-8 sm:p-10 rounded-[2rem] w-full max-w-md text-center space-y-8 border border-slate-100 shadow-2xl mx-4 relative overflow-hidden">
        
        <!-- Arka Plan Dekorasyon -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-orange-50 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-rose-50 rounded-full blur-3xl opacity-50 pointer-events-none"></div>

        <div class="relative z-10">
            <!-- Logo Alanı -->
            <div class="w-20 h-20 bg-gradient-to-tr from-orange-500 to-rose-500 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-orange-500/30 transform -rotate-6 hover:rotate-0 transition-transform duration-300">
                <i data-lucide="shopping-bag" class="w-10 h-10 text-white"></i>
            </div>
            
            <h1 class="text-2xl sm:text-3xl font-black tracking-tighter text-slate-900 mb-2">
                KIBRIS<span class="text-orange-500">BAZAR</span>
            </h1>
            <p class="text-sm text-slate-500 font-medium px-4">Satıcı panelinize, admin merkezinize veya alışveriş profilinize erişmek için giriş yapın.</p>
        </div>

        <div class="relative z-10 pt-4">
            <button id="loginBtn" onclick="window.loginWithGoogle()" class="w-full bg-slate-900 text-white hover:bg-slate-800 font-bold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 transition-all shadow-lg hover:shadow-xl hover:-translate-y-1">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6 bg-white rounded-full p-0.5"> 
                Google ile Devam Et
            </button>
            <p class="text-[10px] text-slate-400 mt-4 leading-relaxed">
                Giriş yaparak Kıbrıs Bazar Kullanıcı Sözleşmesi'ni ve Gizlilik Politikası'nı kabul etmiş sayılırsınız.
            </p>
        </div>
    </div>

    <script type="module">
        import { db, auth } from "./js/firebase-config.js";
        import { signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const provider = new GoogleAuthProvider();
        const APP_ID = 'kibris-pazar';

        // ==========================================
        // YETKİLİ ADMİN E-POSTALARI
        // ==========================================
        // Buraya süper admin paneline erişmesini istediğiniz mailleri ekleyin.
        const ADMIN_EMAILS = [
            "admin@kibrisbazar.com" 
        ];

        window.showLoader = (text) => {
            document.getElementById('loaderText').innerText = text;
            const loader = document.getElementById('fullScreenLoader');
            loader.classList.remove('hidden');
            loader.classList.add('flex');
        };

        window.hideLoader = () => {
            const loader = document.getElementById('fullScreenLoader');
            loader.classList.add('hidden');
            loader.classList.remove('flex');
        };

        // Yönlendirme (Routing) Mantığı
        const checkUserRoleAndRedirect = async (user) => {
            window.showLoader("Yetkileriniz kontrol ediliyor...");

            try {
                // 1. ADMİN KONTROLÜ
                if (ADMIN_EMAILS.includes(user.email)) {
                    window.location.href = "admin.html"; // Admin sayfanızın dosya adı
                    return;
                }

                // 2. SATICI KONTROLÜ (Mağazalar koleksiyonunda eşleşme aranır)
                const storesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'stores');
                
                // Önce E-posta ile mağaza sahibi kontrolü
                const qEmail = query(storesRef, where("email", "==", user.email));
                const snapEmail = await getDocs(qEmail);

                if (!snapEmail.empty) {
                    window.location.href = "satici.html";
                    return;
                }

                // E-posta yoksa UID ile mağaza sahibi kontrolü
                const qUid = query(storesRef, where("ownerId", "==", user.uid));
                const snapUid = await getDocs(qUid);

                if (!snapUid.empty) {
                    window.location.href = "satici.html";
                    return;
                }

                // 3. STANDART KULLANICI / MÜŞTERİ KONTROLÜ
                // Mağazası yoksa ve admin değilse ana sayfaya yönlendirilir.
                window.location.href = "index.html";

            } catch (error) {
                console.error("Yetki kontrolü sırasında hata:", error);
                // Olası bir veritabanı okuma hatasında güvenlik için ana sayfaya atılır.
                window.location.href = "index.html";
            }
        };

        // Oturum Zaten Açıksa Otomatik Yönlendir
        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                checkUserRoleAndRedirect(user);
            }
        });

        // Google Login İşlemi
        window.loginWithGoogle = async () => {
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Bağlanıyor...`;
            lucide.createIcons();

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                // Popup girişinden hemen sonra yönlendirme mekanizmasını tetikler
                await checkUserRoleAndRedirect(user);
            } catch (error) {
                console.error("Giriş işlemi iptal edildi veya başarısız oldu:", error);
                btn.disabled = false;
                btn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6 bg-white rounded-full p-0.5"> Google ile Devam Et`;
                window.hideLoader();
                lucide.createIcons();
            }
        };

        lucide.createIcons();
    </script>
</body>
</html>
