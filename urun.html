<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Ürün Detayı | Kıbrıs Bazar</title>
    
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="theme-color" content="#f97316">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-orange-500 selection:text-white flex flex-col min-h-screen">

    <div id="loadingIndicator" class="fixed inset-0 z-[999] bg-slate-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <i data-lucide="loader-2" class="w-10 h-10 text-orange-500 animate-spin mb-4"></i>
        <p class="text-slate-500 font-bold">Ürün Bilgileri Yükleniyor...</p>
    </div>

    <div class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 sm:px-6 py-3 sm:py-4 flex justify-between items-center shadow-sm">
        <div class="w-1/3 flex justify-start">
            <a href="index.html" class="flex items-center gap-2 text-slate-600 hover:text-orange-500 font-bold text-sm transition bg-white py-1.5 px-3 rounded-lg border border-slate-200 hover:border-orange-200">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> <span class="hidden sm:inline">Vitrine Dön</span>
            </a>
        </div>
        
        <div class="w-1/3 flex justify-center items-center">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-tighter text-slate-900">
                KIBRIS<span class="text-orange-500">BAZAR</span>
            </a>
        </div>
        
        <div class="w-1/3 flex justify-end">
            <a href="sepet.html" class="flex items-center justify-center p-2 text-slate-600 hover:text-orange-500 transition-colors relative bg-white border border-slate-200 hover:border-orange-200 rounded-lg">
                <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                <span id="cartCountBadge" class="absolute -top-1.5 -right-1.5 bg-orange-500 text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center shadow-sm hidden">0</span>
            </a>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 flex-1 w-full">
        <nav class="flex items-center gap-2 text-xs font-bold text-slate-400 mb-6 overflow-x-auto whitespace-nowrap no-scrollbar">
            <a href="index.html" class="hover:text-orange-500 transition">Anasayfa</a>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            <span id="breadcrumbCategory" class="text-slate-600">Kategori</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            <span id="breadcrumbStore" class="text-slate-600">Mağaza</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            <span id="breadcrumbTitle" class="text-orange-600 font-black truncate max-w-[200px]">Ürün Adı</span>
        </nav>

        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden p-6 sm:p-10 grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16 items-start">
            
            <div class="space-y-4">
                <div class="w-full aspect-square rounded-2xl bg-slate-100 overflow-hidden border border-slate-200 relative shadow-inner">
                    <img id="mainProductImage" src="" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/600x600/cbd5e1/475569?text=Gorsel';">
                    <div id="productBadgesContainer" class="absolute top-4 left-4 flex flex-col gap-2 items-start z-10"></div>
                </div>
                <div id="thumbnailContainer" class="flex gap-3 overflow-x-auto pb-2 no-scrollbar"></div>
            </div>

            <div class="space-y-6">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <a id="storeProfileLink" href="#" class="text-xs font-black text-orange-600 bg-orange-50 hover:bg-orange-100 px-3 py-1.5 rounded-lg transition inline-flex items-center gap-1.5 border border-orange-200">
                            <i data-lucide="store" class="w-3.5 h-3.5"></i> <span id="storeNameBadge">Mağaza Adı</span>
                        </a>
                        <span id="categoryBadge" class="text-xs font-bold text-slate-400 bg-slate-100 px-3 py-1.5 rounded-lg">Kategori</span>
                    </div>
                    <h1 id="productTitle" class="text-2xl sm:text-3xl font-black text-slate-900 leading-tight">Yükleniyor...</h1>
                </div>

                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 flex items-center justify-between">
                    <div>
                        <span class="text-xs font-bold text-slate-400 block mb-1">Satış Fiyatı</span>
                        <div class="flex items-baseline gap-3">
                            <span id="productPrice" class="text-3xl font-black text-orange-600">0.00 TL</span>
                            <span id="productOriginalPrice" class="text-sm font-bold text-slate-400 line-through hidden">0.00 TL</span>
                        </div>
                    </div>
                    <div id="discountRibbon" class="hidden bg-rose-500 text-white text-xs font-black px-3 py-1.5 rounded-xl shadow-md">-%0 İndirim</div>
                </div>

                <div id="variantsSection" class="hidden space-y-3 pt-2">
                    <label class="block text-xs font-bold text-slate-700" id="variantGroupName">Seçenekler:</label>
                    <div id="variantOptionsContainer" class="flex flex-wrap gap-2"></div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Ürün Açıklaması</h3>
                    <p id="productDescription" class="text-sm text-slate-600 leading-relaxed whitespace-pre-line">Yükleniyor...</p>
                </div>

                <div class="pt-4 border-t border-slate-100 space-y-3">
                    <button onclick="window.addToCart()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-2xl transition shadow-xl shadow-orange-500/20 flex items-center justify-center gap-2 text-base">
                        <i data-lucide="shopping-cart" class="w-5 h-5"></i> Sepete Ekle
                    </button>
                    <a id="whatsappOrderBtn" href="#" target="_blank" class="w-full bg-[#25D366] hover:bg-[#1DA851] text-white font-black py-3.5 rounded-2xl transition flex items-center justify-center gap-2 text-sm shadow-md">
                        <i data-lucide="message-circle" class="w-5 h-5"></i> WhatsApp ile Hemen Sipariş Ver
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 mt-auto pt-8 pb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4 text-xs font-medium text-slate-400">
            <p>&copy; 2026 Kıbrıs Bazar. Tüm Hakları Saklıdır.</p>
            <div class="flex items-center gap-2">
                <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i> Güvenli Yerel Alışveriş
            </div>
        </div>
    </footer>

    <script type="module">
        import { db } from "./js/firebase-config.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const APP_ID = 'kibris-pazar';
        let currentProduct = null;
        let selectedVariant = null;
        let currentActivePrice = 0;
        let currentActiveImage = '';
        
        let cart = JSON.parse(localStorage.getItem('cart_items_v2')) || [];

        // SEO Uyumlu Slug Üretici
        window.generateSlug = (text) => {
            if (!text) return 'kibris-bazar';
            return text.toString().toLowerCase()
                .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's')
                .replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c')
                .replace(/\s+/g, '-')
                .replace(/[^\w\-]+/g, '')
                .replace(/\-\-+/g, '-')
                .replace(/^-+|-+$/g, '');
        };

        // YENİ: Slug + ID yapısından sadece ID'yi çeken fonksiyon
        function getProductIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            let rawPath = urlParams.get('id');
            if (!rawPath) {
                const pathParts = window.location.pathname.split('/');
                const urunIndex = pathParts.indexOf('urun');
                if (urunIndex !== -1 && pathParts[urunIndex + 1]) {
                    rawPath = pathParts[urunIndex + 1];
                }
            }
            if (rawPath) {
                const parts = rawPath.split('-');
                return parts[parts.length - 1]; 
            }
            return null;
        }

        function updateCartBadge() {
            let totalQty = 0;
            cart.forEach(item => totalQty += item.quantity);
            const badge = document.getElementById('cartCountBadge');
            if(badge) {
                badge.innerText = totalQty;
                if(totalQty > 0) badge.classList.remove('hidden');
                else badge.classList.add('hidden');
            }
        }

        async function initProductPage() {
            updateCartBadge();
            const productId = getProductIdFromUrl();

            if (!productId) {
                document.getElementById('loadingIndicator').innerHTML = '<p class="text-rose-500 font-bold">Ürün ID bulunamadı.</p>';
                return;
            }

            try {
                const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'products', productId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    document.getElementById('loadingIndicator').innerHTML = '<p class="text-rose-500 font-bold">Ürün bulunamadı veya yayından kaldırılmış.</p>';
                    return;
                }

                currentProduct = { id: docSnap.id, ...docSnap.data() };
                currentActivePrice = currentProduct.price;
                currentActiveImage = (currentProduct.images && currentProduct.images.length > 0) ? currentProduct.images[0] : '';

                document.title = `${currentProduct.title} | ${currentProduct.storeName || 'Kıbrıs Bazar'}`;
                document.getElementById('pageTitle').innerText = `${currentProduct.title} | Kıbrıs Bazar`;

                // Eğer doğrudan slug link ile gelindiyse URL'yi tarayıcıda temiz göster
                const expectedSlug = window.generateSlug(currentProduct.title) + '-' + currentProduct.id;
                const currentPath = window.location.pathname;
                if(currentPath.includes('/urun/') && !currentPath.endsWith(expectedSlug)) {
                    window.history.replaceState({}, '', `/urun/${expectedSlug}`);
                }

                document.getElementById('breadcrumbCategory').innerText = currentProduct.category || 'Genel';
                document.getElementById('breadcrumbStore').innerText = currentProduct.storeName || 'Mağaza';
                document.getElementById('breadcrumbTitle').innerText = currentProduct.title;

                document.getElementById('productTitle').innerText = currentProduct.title;
                document.getElementById('productDescription').innerText = currentProduct.description || 'Açıklama belirtilmemiş.';
                document.getElementById('categoryBadge').innerText = currentProduct.category || 'Genel';
                
                document.getElementById('storeNameBadge').innerText = currentProduct.storeName || 'Mağaza';
                
                // Mağazaya giden linki Slug sistemine uyarla
                const storeSlug = window.generateSlug(currentProduct.storeName);
                document.getElementById('storeProfileLink').href = `/magaza/${storeSlug}-${currentProduct.storeId}`;

                document.getElementById('productPrice').innerText = currentProduct.price.toLocaleString('tr-TR') + " TL";
                if (currentProduct.originalPrice && currentProduct.originalPrice > currentProduct.price) {
                    const origEl = document.getElementById('productOriginalPrice');
                    origEl.innerText = currentProduct.originalPrice.toLocaleString('tr-TR') + " TL";
                    origEl.classList.remove('hidden');
                    
                    const disc = Math.round(((currentProduct.originalPrice - currentProduct.price) / currentProduct.originalPrice) * 100);
                    const rib = document.getElementById('discountRibbon');
                    rib.innerText = `-%${disc} İndirim`;
                    rib.classList.remove('hidden');
                }

                let badgesHtml = '';
                if (currentProduct.freeDelivery) badgesHtml += `<div class="bg-[#0ea5e9] text-white text-[10px] font-black px-3 py-1 rounded-xl shadow-md uppercase tracking-wider">Ücretsiz Teslimat</div>`;
                if (currentProduct.cashOnDelivery) badgesHtml += `<div class="bg-emerald-500 text-white text-[10px] font-black px-3 py-1 rounded-xl shadow-md uppercase tracking-wider">Kapıda Ödeme</div>`;
                document.getElementById('productBadgesContainer').innerHTML = badgesHtml;

                renderImages();

                if (currentProduct.variants && currentProduct.variants.length > 0) {
                    renderVariants();
                }

                setupWhatsAppButton();

                document.getElementById('loadingIndicator').classList.add('opacity-0');
                setTimeout(() => document.getElementById('loadingIndicator').classList.add('hidden'), 300);
                lucide.createIcons();

            } catch (err) {
                console.error(err);
                document.getElementById('loadingIndicator').innerHTML = '<p class="text-rose-500 font-bold">Veriler yüklenirken hata oluştu.</p>';
            }
        }

        function renderImages() {
            const mainImg = document.getElementById('mainProductImage');
            mainImg.src = currentActiveImage;

            const thumbContainer = document.getElementById('thumbnailContainer');
            if (!currentProduct.images || currentProduct.images.length <= 1) {
                thumbContainer.classList.add('hidden');
                return;
            }

            let html = '';
            currentProduct.images.forEach((imgUrl, idx) => {
                const isActive = imgUrl === currentActiveImage;
                html += `
                    <button onclick="window.changeMainImage('${imgUrl}')" class="w-20 h-20 rounded-xl overflow-hidden border-2 ${isActive ? 'border-orange-500 shadow-md' : 'border-slate-200 opacity-70 hover:opacity-100'} transition shrink-0 bg-slate-100">
                        <img src="${imgUrl}" class="w-full h-full object-cover">
                    </button>
                `;
            });
            thumbContainer.innerHTML = html;
        }

        window.changeMainImage = (url) => {
            currentActiveImage = url;
            renderImages();
        };

        function renderVariants() {
            const section = document.getElementById('variantsSection');
            section.classList.remove('hidden');

            const groupName = currentProduct.variants[0].group || 'Seçenek';
            document.getElementById('variantGroupName').innerText = `${groupName} Seçiniz:`;

            let html = '';
            currentProduct.variants.forEach((v, idx) => {
                const isSelected = selectedVariant === v.name;
                html += `
                    <button type="button" onclick="window.selectVariant('${v.name}', ${v.price}, '${v.image || ''}')" class="px-4 py-2.5 rounded-xl border-2 text-xs font-bold transition ${isSelected ? 'border-orange-500 bg-orange-50 text-orange-600 shadow-sm' : 'border-slate-200 bg-white text-slate-700 hover:border-slate-300'}">
                        ${v.name} <span class="opacity-75 font-normal ml-1">(${v.price.toLocaleString('tr-TR')} TL)</span>
                    </button>
                `;
            });
            document.getElementById('variantOptionsContainer').innerHTML = html;
        }

        window.selectVariant = (name, price, imageUrl) => {
            selectedVariant = name;
            currentActivePrice = price;
            if (imageUrl) currentActiveImage = imageUrl;

            document.getElementById('productPrice').innerText = price.toLocaleString('tr-TR') + " TL";
            renderImages();
            renderVariants();
            setupWhatsAppButton();
        };

        function setupWhatsAppButton() {
            const waBtn = document.getElementById('whatsappOrderBtn');
            let phone = (currentProduct.storeWhatsapp || '').replace(/\D/g,'');
            if (phone.length === 10 && !phone.startsWith('90')) phone = '90' + phone;

            const priceText = currentActivePrice.toLocaleString('tr-TR') + " TL";
            const variantText = selectedVariant ? ` (Seçenek: ${selectedVariant})` : '';
            
            let message = `Merhaba *${currentProduct.storeName || 'Mağaza'}*, şu ürününüzü sipariş etmek istiyorum:\n\n`;
            message += `📦 *Ürün:* ${currentProduct.title}${variantText}\n`;
            message += `💰 *Fiyat:* ${priceText}\n\n`;
            message += `Siparişimi onaylıyor musunuz?`;

            waBtn.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        }

        window.addToCart = () => {
            if (currentProduct.variants && currentProduct.variants.length > 0 && !selectedVariant) {
                alert("Lütfen bir seçenek (renk/beden vb.) seçiniz.");
                return;
            }

            const cartItemId = currentProduct.id + (selectedVariant ? `_${selectedVariant}` : '');
            const existing = cart.find(item => item.cartItemId === cartItemId);

            if (existing) {
                existing.quantity++;
            } else {
                cart.push({
                    cartItemId: cartItemId,
                    product: currentProduct,
                    variant: selectedVariant,
                    quantity: 1,
                    dynamicPrice: currentActivePrice,
                    dynamicImage: currentActiveImage
                });
            }

            localStorage.setItem('cart_items_v2', JSON.stringify(cart));
            updateCartBadge();
            alert("Ürün sepete başarıyla eklendi!");
        };

        document.addEventListener('DOMContentLoaded', initProductPage);
    </script>
</body>
</html>
