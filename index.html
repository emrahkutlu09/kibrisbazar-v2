<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kıbrıs Bazar | KKTC'nin Güvenilir Alışveriş Platformu</title>
    
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="theme-color" content="#f97316">
    <meta name="description" content="Kıbrıs genelinde binlerce ürün, yerel mağazalar ve güvenli alışveriş fırsatları Kıbrıs Bazar'da!">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-orange-500 selection:text-white flex flex-col min-h-screen">

    <!-- Üst Menü / Navbar -->
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            
            <a href="/" class="text-xl sm:text-2xl font-black tracking-tighter text-slate-900 shrink-0">
                KIBRIS<span class="text-orange-500">BAZAR</span>
            </a>

            <!-- Arama Çubuğu -->
            <div class="flex-1 max-w-xl mx-2 sm:mx-4">
                <div class="relative w-full">
                    <input type="text" id="searchInput" placeholder="Ürün veya mağaza ara..." 
                        class="w-full bg-slate-100 border border-slate-200 rounded-xl pl-10 pr-4 py-2 text-xs sm:text-sm focus:outline-none focus:border-orange-500 focus:bg-white transition-all placeholder:text-slate-400">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                </div>
            </div>

            <!-- Sağ Butonlar -->
            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                <a href="sepet.html" class="flex items-center justify-center p-2 text-slate-600 hover:text-orange-500 transition-colors relative bg-white border border-slate-200 hover:border-orange-200 rounded-xl">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span id="cartCountBadge" class="absolute -top-1.5 -right-1.5 bg-orange-500 text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center shadow-sm hidden">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Kategori Filtre Çubuğu -->
    <div class="bg-white border-b border-slate-200 sticky top-16 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <div id="categoryContainer" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5">
                <button onclick="window.filterByCategory('')" class="whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition bg-slate-900 text-white" id="catBtnAll">Tümü</button>
            </div>
        </div>
    </div>

    <!-- Ana İçerik -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex-1 w-full">
        
        <!-- Yükleniyor / Bilgi Durumu -->
        <div id="loadingIndicator" class="flex flex-col items-center justify-center py-20">
            <i data-lucide="loader-2" class="w-8 h-8 text-orange-500 animate-spin mb-3"></i>
            <p class="text-xs font-bold text-slate-500">Ürünler Listeleniyor...</p>
        </div>

        <!-- Ürünler Izgarası -->
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-6 hidden"></div>

        <!-- Sonuç Bulunamadı -->
        <div id="noResults" class="hidden text-center py-24">
            <div class="w-14 h-14 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400">
                <i data-lucide="package-search" class="w-7 h-7"></i>
            </div>
            <p class="text-sm font-bold text-slate-600">Aradığınız kriterlere uygun ürün bulunamadı.</p>
        </div>
    </main>

    <!-- Alt Bilgi / Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4 text-xs font-medium text-slate-400">
            <p>&copy; 2026 Kıbrıs Bazar. Tüm Hakları Saklıdır.</p>
            <div class="flex items-center gap-2">
                <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i> Güvenli Yerel Alışveriş
            </div>
        </div>
    </footer>

    <!-- Firebase ve Uygulama Mantığı -->
    <script type="module">
        import { db } from "./js/firebase-config.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const APP_ID = 'kibris-pazar';
        let allProducts = [];
        let activeCategory = '';
        let searchQuery = '';

        let cart = JSON.parse(localStorage.getItem('cart_items_v2')) || [];
        let favorites = JSON.parse(localStorage.getItem('user_favorites')) || [];

        // SEO Uyumlu Metin Temizleyici (Slug Üretici)
        window.generateSlug = (text) => {
            if (!text) return 'kibris-bazar';
            return text.toString().toLowerCase()
                .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's')
                .replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c')
                .replace(/\s+/g, '-')
                .replace(/[^\w\-]+/g, '')
                .replace(/\-\-+/g, '-')
                .replace(/^-+|-+$/g, '');
        };

        function updateCartBadge() {
            let totalQty = 0;
            cart.forEach(item => totalQty += item.quantity);
            const badge = document.getElementById('cartCountBadge');
            if(badge) {
                badge.innerText = totalQty;
                if(totalQty > 0) badge.classList.remove('hidden');
                else badge.classList.add('hidden');
            }
        }

        window.toggleFavorite = (id) => {
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('user_favorites', JSON.stringify(favorites));
            renderProducts();
        };

        window.quickAddToCart = (id) => {
            const product = allProducts.find(p => p.id === id);
            if(!product) return;
            const exist = cart.find(i => i.cartItemId === id);
            if(exist) {
                exist.quantity++;
            } else {
                cart.push({
                    cartItemId: id,
                    product: product,
                    variant: null,
                    quantity: 1,
                    dynamicPrice: product.price,
                    dynamicImage: (product.images && product.images.length > 0 ? product.images[0] : '')
                });
            }
            localStorage.setItem('cart_items_v2', JSON.stringify(cart));
            updateCartBadge();
            alert("Ürün sepete eklendi!");
        };

        // Ürün Kartı Görsel Yapısı (Yeni SEO Link Yapısıyla)
        window.createProductCard = (p) => {
            const discount = p.originalPrice > p.price ? Math.round(((p.originalPrice - p.price) / p.originalPrice) * 100) : 0;
            const img = (p.images && p.images.length > 0) ? p.images[0] : 'https://placehold.co/400x500/cbd5e1/475569?text=Gorsel';
            const isFav = favorites.includes(p.id);

            // Kusursuz SEO URL Şablonları
            const productUrl = `/urun/${window.generateSlug(p.title)}-${p.id}`;
            const storeUrl = `/magaza/${window.generateSlug(p.storeName || 'magaza')}-${p.storeId}`;

            return `
                <div class="bg-white rounded-2xl p-3 hover:shadow-xl hover:border-orange-200 border border-slate-200 transition-all group flex flex-col w-full h-full relative">
                    <div class="relative w-full aspect-[4/5] mb-3 overflow-hidden rounded-xl bg-slate-100 shrink-0">
                        <a href="${productUrl}" class="block w-full h-full">
                            <img src="${img}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${p.title}"/>
                        </a>
                        ${discount > 0 ? `<div class="absolute top-2 left-0 bg-rose-500 text-white text-[10px] font-black px-2 py-0.5 rounded-r shadow-md">-%${discount}</div>` : ''}
                        
                        <button onclick="window.toggleFavorite('${p.id}')" class="absolute top-2 right-2 p-2 rounded-full bg-white/90 shadow hover:scale-110 z-10 transition">
                            <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-rose-500 text-rose-500' : 'text-slate-400 hover:text-rose-500'}"></i>
                        </button>
                    </div>

                    <div class="flex-1 flex flex-col">
                        <div class="text-[10px] text-slate-500 font-bold mb-1 flex items-center justify-between gap-1">
                            <a href="${storeUrl}" class="truncate text-slate-400 hover:text-orange-500 transition-colors">${p.storeName || 'Mağaza'}</a>
                        </div>
                        
                        <h3 class="text-xs font-bold text-slate-800 mb-1 line-clamp-2">
                            <a href="${productUrl}" class="hover:text-orange-500 transition-colors">${p.title}</a>
                        </h3>
                        
                        <div class="pt-2 border-t border-slate-100 flex items-end justify-between mt-auto">
                            <div>
                                ${p.originalPrice > p.price ? `<span class="block text-[10px] text-slate-400 line-through mb-0.5">${p.originalPrice.toLocaleString('tr-TR')} TL</span>` : ''}
                                <span class="text-sm font-black text-orange-600 block">${p.price.toLocaleString('tr-TR')} TL</span>
                            </div>
                            <button onclick="window.quickAddToCart('${p.id}')" class="w-8 h-8 rounded-full bg-orange-50 hover:bg-orange-500 text-orange-500 hover:text-white flex items-center justify-center transition shadow-sm shrink-0 z-10 pointer-events-auto">
                                <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            const categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))];

            let html = `
                <button onclick="window.filterByCategory('')" 
                    class="whitespace-nowrap px-4 py-1.5 rounded-full text-xs transition ${activeCategory === '' ? 'bg-slate-900 text-white font-black' : 'bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold'}">
                    Tümü
                </button>
            `;

            categories.forEach(cat => {
                const isActive = activeCategory === cat;
                html += `
                    <button onclick="window.filterByCategory('${cat}')" 
                        class="whitespace-nowrap px-4 py-1.5 rounded-full text-xs transition ${isActive ? 'bg-orange-500 text-white font-black' : 'bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold'}">
                        ${cat}
                    </button>
                `;
            });

            container.innerHTML = html;
        }

        window.filterByCategory = (cat) => {
            activeCategory = cat;
            renderCategories();
            renderProducts();
        };

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const noResults = document.getElementById('noResults');

            let filtered = allProducts;

            if (activeCategory) {
                filtered = filtered.filter(p => p.category === activeCategory);
            }

            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(p => 
                    (p.title && p.title.toLowerCase().includes(q)) || 
                    (p.storeName && p.storeName.toLowerCase().includes(q)) ||
                    (p.category && p.category.toLowerCase().includes(q))
                );
            }

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                grid.innerHTML = filtered.map(p => window.createProductCard(p)).join('');
                grid.classList.remove('hidden');
                lucide.createIcons();
            }
        }

        async function initPage() {
            updateCartBadge();
            lucide.createIcons();

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value;
                    renderProducts();
                });
            }

            try {
                const q = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'products'), where("isActive", "==", true));
                const snap = await getDocs(q);

                allProducts = [];
                snap.forEach(doc => {
                    allProducts.push({ id: doc.id, ...doc.data() });
                });

                document.getElementById('loadingIndicator').classList.add('hidden');
                renderCategories();
                renderProducts();

            } catch (err) {
                console.error("Ürünler yüklenirken hata oluştu:", err);
                document.getElementById('loadingIndicator').innerHTML = '<p class="text-xs font-bold text-rose-500">Ürünler yüklenemedi, lütfen sayfayı yenileyin.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
