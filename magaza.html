<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Mağaza Profili | Kıbrıs Bazar</title>
    
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="theme-color" content="#f97316">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .leaflet-container { z-index: 10 !important; font-family: 'Inter', sans-serif;}
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-orange-500 selection:text-white flex flex-col min-h-screen">

    <div id="loadingIndicator" class="fixed inset-0 z-[999] bg-slate-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <i data-lucide="loader-2" class="w-10 h-10 text-orange-500 animate-spin mb-4"></i>
        <p class="text-slate-500 font-bold">Mağaza Vitrini Hazırlanıyor...</p>
    </div>

    <div class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 sm:px-6 py-3 sm:py-4 flex justify-between items-center shadow-sm">
        <div class="w-1/3 flex justify-start">
            <a href="index.html" class="flex items-center gap-2 text-slate-600 hover:text-orange-500 font-bold text-sm transition bg-white py-1.5 px-3 rounded-lg border border-slate-200 hover:border-orange-200">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> <span class="hidden sm:inline">Pazaryerine Dön</span>
            </a>
        </div>
        
        <div class="w-1/3 flex justify-center items-center">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-tighter text-slate-900">
                KIBRIS<span class="text-orange-500">BAZAR</span>
            </a>
        </div>
        
        <div class="w-1/3 flex justify-end">
            <a href="sepet.html" class="flex items-center justify-center p-2 text-slate-600 hover:text-orange-500 transition-colors relative bg-white border border-slate-200 hover:border-orange-200 rounded-lg">
                <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                <span id="spCartCountBadge" class="absolute -top-1.5 -right-1.5 bg-orange-500 text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center shadow-sm hidden">0</span>
            </a>
        </div>
    </div>
    
    <div class="relative w-full h-64 sm:h-80 bg-slate-900 overflow-hidden shrink-0">
        <img id="spCover" src="" class="w-full h-full object-cover opacity-50 hidden" alt="Kapak">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/40 to-transparent"></div>
        <div class="absolute bottom-0 left-0 w-full p-6 sm:p-8 max-w-7xl mx-auto flex flex-col sm:flex-row items-start sm:items-end gap-5">
            <div class="w-20 h-20 sm:w-28 sm:h-28 rounded-[2rem] bg-white p-1.5 shadow-2xl shrink-0 border-4 border-slate-900 overflow-hidden flex items-center justify-center">
                <img id="spLogo" src="" class="w-full h-full object-contain rounded-[1.2rem] hidden" alt="Logo">
                <div id="spLogoFallback" class="w-full h-full rounded-[1.2rem] bg-slate-50 flex items-center justify-center"><i data-lucide="store" class="w-8 h-8 sm:w-10 sm:h-10 text-slate-300"></i></div>
            </div>
            <div class="pb-1 w-full flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 z-10">
                <div>
                    <h1 class="text-3xl sm:text-4xl font-black text-white flex items-center gap-2 tracking-tight">
                        <span id="spName">Mağaza Adı</span> 
                        <span id="spPremium" class="hidden" title="Premium Mağaza"><i data-lucide="award" class="w-6 h-6 text-purple-400"></i></span>
                    </h1>
                    <p class="text-slate-300 text-sm font-bold flex items-center gap-4 mt-2 mb-3">
                        <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-4 h-4 text-orange-400"></i> <span id="spDistrict">Konum</span></span>
                        <span class="flex items-center gap-1"><i data-lucide="heart" class="w-4 h-4 text-rose-400"></i> <span id="spFollowersCount">0</span> Takipçi</span>
                    </p>
                    
                    <div id="spSocialLinks" class="flex items-center gap-3 hidden"></div>
                </div>
                <div class="flex gap-2 w-full sm:w-auto mt-4 sm:mt-0">
                    <button id="spFollowBtn" class="w-full sm:w-auto bg-white text-slate-900 px-5 py-2.5 rounded-xl font-bold text-sm transition flex justify-center items-center gap-2 shadow-lg shadow-white/20 hover:bg-rose-50 hover:text-rose-600">
                        <i data-lucide="heart" class="w-4 h-4"></i> <span id="spFollowBtnText">Takip Et</span>
                    </button>
                    <button id="spWhatsappBtn" class="w-full sm:w-auto bg-[#25D366] text-white px-5 py-2.5 rounded-xl font-bold text-sm transition flex justify-center items-center gap-2 shadow-lg shadow-green-500/20 hover:bg-[#1DA851] hidden">
                        <i data-lucide="message-circle" class="w-4 h-4"></i> Satıcıya Sor
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="spMapContainerWrapper" class="bg-white border-b border-slate-200 hidden shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-black text-slate-800 flex items-center gap-2"><i data-lucide="map-pin" class="w-4 h-4 text-orange-500"></i> Mağaza Konumu</h3>
                <a id="spGoogleMapsLink" href="#" target="_blank" class="text-[10px] font-bold bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-slate-600 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                    <i data-lucide="navigation" class="w-3 h-3"></i> Yol Tarifi Al
                </a>
            </div>
            <div class="w-full h-48 sm:h-64 rounded-2xl overflow-hidden border border-slate-200 bg-slate-100 z-10 relative">
                <div id="spLeafletMap" class="w-full h-full"></div>
            </div>
        </div>
    </div>

    <div class="bg-white border-b border-slate-200 sticky top-[60px] sm:top-[69px] z-40 shadow-sm shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4">
            <div id="spCategoryContainer" class="flex items-center gap-3 overflow-x-auto no-scrollbar"></div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-black text-slate-900">Mağaza Ürünleri</h2>
            <span id="spProductCount" class="text-xs font-bold text-slate-500 bg-slate-200 px-3 py-1 rounded-full">0</span>
        </div>
        <div id="spProductsContainer" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-6"></div>
    </div>

    <footer class="bg-white border-t border-slate-200 mt-auto pt-8 pb-8 shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4 text-xs font-medium text-slate-400">
            <p>&copy; 2026 Kıbrıs Bazar. Tüm Hakları Saklıdır.</p>
            <div class="flex items-center gap-2">
                <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i> Komisyonsuz Yerel Alışveriş
            </div>
        </div>
    </footer>

    <script type="module">
        import { db, auth } from "./js/firebase-config.js";
        import { doc, getDoc, collection, query, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const APP_ID = 'kibris-pazar';
        let currentStore = null;
        let storeProducts = [];
        let spActiveCategory = '';
        let spMapInstance = null;
        
        let cart = JSON.parse(localStorage.getItem('cart_items_v2')) || [];
        let favorites = JSON.parse(localStorage.getItem('user_favorites')) || [];
        let currentUserUid = null;

        function getStoreIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            let id = urlParams.get('id');
            if (!id) {
                const pathParts = window.location.pathname.split('/');
                const magazaIndex = pathParts.indexOf('magaza');
                if (magazaIndex !== -1 && pathParts[magazaIndex + 1]) {
                    id = pathParts[magazaIndex + 1];
                }
            }
            return id;
        }

        function updateCartBadge() {
            let totalQty = 0;
            cart.forEach(item => totalQty += item.quantity);
            const badge = document.getElementById('spCartCountBadge');
            if(badge) {
                badge.innerText = totalQty;
                if(totalQty > 0) badge.classList.remove('hidden');
                else badge.classList.add('hidden');
            }
        }

        window.toggleFavorite = (id) => {
            if (favorites.includes(id)) { favorites = favorites.filter(f => f !== id); } 
            else { favorites.push(id); }
            localStorage.setItem('user_favorites', JSON.stringify(favorites));
            window.renderStoreProfileProducts();
        };

        window.quickAddToCart = (id) => {
            const product = storeProducts.find(p => p.id === id);
            if(!product) return;
            const exist = cart.find(i => i.cartItemId === id);
            if(exist) exist.quantity++;
            else cart.push({ cartItemId: id, product: product, variant: null, quantity: 1, dynamicPrice: product.price, dynamicImage: (product.images ? product.images[0] : '') });
            
            localStorage.setItem('cart_items_v2', JSON.stringify(cart));
            updateCartBadge();
            alert("Ürün sepete eklendi!"); 
        };

        window.createProductCard = (p) => {
            const discount = p.originalPrice > p.price ? Math.round(((p.originalPrice - p.price) / p.originalPrice) * 100) : 0;
            const img = (p.images && p.images.length > 0) ? p.images[0] : 'https://placehold.co/400x500/cbd5e1/475569?text=Gorsel';
            const isFav = favorites.includes(p.id);
            const isPremiumStore = currentStore && (currentStore.isPremium || currentStore.packageType === 'premium');
            
            return `
                <div class="bg-white rounded-2xl p-3 hover:shadow-xl hover:border-orange-200 border border-slate-200 transition-all group flex flex-col w-full h-full relative">
                    <div class="relative w-full aspect-[4/5] mb-3 overflow-hidden rounded-xl bg-slate-100 shrink-0">
                        <a href="/urun/${p.id}" class="block w-full h-full">
                            <img src="${img}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${p.title}"/>
                        </a>
                        ${discount > 0 ? `<div class="absolute top-2 left-0 bg-rose-500 text-white text-[10px] font-black px-2 py-0.5 rounded-r shadow-md">-%${discount}</div>` : ''}
                        
                        <button onclick="window.toggleFavorite('${p.id}')" class="absolute top-2 right-2 p-2 rounded-full bg-white/90 shadow hover:scale-110 z-10 transition">
                            <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-rose-500 text-rose-500' : 'text-slate-400 hover:text-rose-500'}"></i>
                        </button>
                    </div>

                    <div class="flex-1 flex flex-col">
                        <div class="text-[10px] text-slate-500 font-bold mb-1 flex items-center justify-between gap-1">
                            <span class="flex items-center gap-1 truncate text-slate-400">
                                <span class="truncate">${p.storeName}</span>
                                ${isPremiumStore ? `<i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500 shrink-0"></i>` : ''}
                            </span>
                        </div>
                        
                        <h3 class="text-xs font-bold text-slate-800 mb-1 line-clamp-2">
                            <a href="/urun/${p.id}" class="hover:text-orange-500 transition-colors">${p.title}</a>
                        </h3>
                        
                        <div class="pt-2 border-t border-slate-100 flex items-end justify-between mt-auto">
                            <div>
                                ${p.originalPrice > p.price ? `<span class="block text-[10px] text-slate-400 line-through mb-0.5">${p.originalPrice.toLocaleString('tr-TR')} TL</span>` : ''}
                                <span class="text-sm font-black text-orange-600 block">${p.price.toLocaleString('tr-TR')} TL</span>
                            </div>
                            <button onclick="window.quickAddToCart('${p.id}')" class="w-8 h-8 rounded-full bg-orange-50 hover:bg-orange-500 text-orange-500 hover:text-white flex items-center justify-center transition shadow-sm shrink-0 z-10 pointer-events-auto">
                                <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.contactStoreForInfo = () => {
            if (!currentStore || !currentStore.whatsapp) {
                alert("Satıcının iletişim numarası bulunamadı.");
                return;
            }
            let phone = currentStore.whatsapp.replace(/\D/g,'');
            if (phone.length === 10 && !phone.startsWith('90')) phone = '90' + phone;

            let message = `Merhaba *${currentStore.name}*, Kıbrıs Bazar üzerinden ulaşıyorum. Ürünleriniz ve mağazanız hakkında bilgi almak istiyorum.`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        };

        window.toggleStoreFollow = async () => {
            if (!currentUserUid) {
                alert("Mağazayı takip etmek için pazaryeri ana sayfasından giriş yapmalısınız.");
                return;
            }
            
            let followers = currentStore.followers || [];
            if (followers.includes(currentUserUid)) {
                followers = followers.filter(id => id !== currentUserUid);
            } else {
                followers.push(currentUserUid);
            }
            
            try {
                const btn = document.getElementById('spFollowBtn');
                btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>`;
                lucide.createIcons();
                
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'stores', currentStore.id), { followers: followers });
                currentStore.followers = followers;
                updateFollowButtonUI();
            } catch(e) {
                console.error(e);
            }
        };

        function updateFollowButtonUI() {
            const followers = currentStore.followers || [];
            document.getElementById('spFollowersCount').innerText = followers.length;
            
            const btn = document.getElementById('spFollowBtn');
            if (currentUserUid && followers.includes(currentUserUid)) {
                btn.innerHTML = `<i data-lucide="heart" class="w-4 h-4 fill-rose-500 text-rose-500"></i> <span id="spFollowBtnText">Takibi Bırak</span>`;
                btn.className = "w-full sm:w-auto bg-rose-50 text-rose-600 border border-rose-200 px-5 py-2.5 rounded-xl font-bold text-sm transition flex justify-center items-center gap-2 shadow-lg hover:bg-rose-100";
            } else {
                btn.innerHTML = `<i data-lucide="heart" class="w-4 h-4"></i> <span id="spFollowBtnText">Takip Et</span>`;
                btn.className = "w-full sm:w-auto bg-white text-slate-900 px-5 py-2.5 rounded-xl font-bold text-sm transition flex justify-center items-center gap-2 shadow-lg shadow-white/20 hover:bg-rose-50 hover:text-rose-600";
            }
            lucide.createIcons();
        }

        window.renderStoreProfileCategories = () => {
            const container = document.getElementById('spCategoryContainer');
            const uniqueCats = [...new Set(storeProducts.map(p => p.category))];
            
            let html = `<button onclick="window.spSetCategory('')" class="whitespace-nowrap px-5 py-2 rounded-full text-xs transition ${spActiveCategory === '' ? 'bg-slate-900 text-white font-black' : 'bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold'}">Tüm Kategoriler</button>`;
            
            uniqueCats.forEach(cat => {
                const count = storeProducts.filter(p => p.category === cat).length;
                const isActive = spActiveCategory === cat;
                html += `<button onclick="window.spSetCategory('${cat}')" class="whitespace-nowrap px-5 py-2 rounded-full text-xs transition ${isActive ? 'bg-orange-500 text-white font-black' : 'bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold'}">${cat} <span class="ml-1 opacity-75">(${count})</span></button>`;
            });
            container.innerHTML = html;
        };

        window.spSetCategory = (cat) => { 
            spActiveCategory = cat; 
            window.renderStoreProfileCategories(); 
            window.renderStoreProfileProducts(); 
        };

        window.renderStoreProfileProducts = () => {
            const container = document.getElementById('spProductsContainer');
            let displayList = storeProducts;
            
            if(spActiveCategory) displayList = displayList.filter(p => p.category === spActiveCategory);
            document.getElementById('spProductCount').innerText = `${displayList.length} Ürün`;

            if(displayList.length === 0) {
                container.innerHTML = `<div class="col-span-full py-20 text-center"><p class="text-slate-500 font-bold">Bu kategoride ürün bulunamadı.</p></div>`;
                return;
            }

            let html = '';
            displayList.forEach(p => { html += `<div>${window.createProductCard(p)}</div>`; });
            container.innerHTML = html;
            lucide.createIcons();
        };

        async function initStorePage() {
            updateCartBadge();
            lucide.createIcons();

            const storeId = getStoreIdFromUrl();
            if (!storeId) {
                document.getElementById('loadingIndicator').innerHTML = '<p class="text-rose-500 font-bold">Mağaza bulunamadı veya link hatalı.</p>';
                return;
            }

            try {
                const storeSnap = await getDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'stores', storeId));
                if (!storeSnap.exists() || storeSnap.data().status !== 'active') {
                    document.getElementById('loadingIndicator').innerHTML = '<p class="text-rose-500 font-bold">Bu mağaza sistemde bulunamadı veya aktif değil.</p>';
                    return;
                }
                
                currentStore = { id: storeSnap.id, ...storeSnap.data() };

                document.getElementById('spName').innerText = currentStore.name;
                document.getElementById('spDistrict').innerText = currentStore.district;
                document.title = `${currentStore.name} | Kıbrıs Bazar`;

                if(currentStore.isPremium || currentStore.packageType === 'premium') {
                    document.getElementById('spPremium').classList.remove('hidden');
                }

                const socialLinksContainer = document.getElementById('spSocialLinks');
                let socialHtml = '';
                if(currentStore.website) {
                    let webUrl = currentStore.website.startsWith('http') ? currentStore.website : 'https://' + currentStore.website;
                    socialHtml += `<a href="${webUrl}" target="_blank" class="w-9 h-9 rounded-full bg-white/10 hover:bg-orange-500 border border-white/20 flex items-center justify-center text-white transition backdrop-blur-md shadow-lg"><i data-lucide="globe" class="w-4 h-4"></i></a>`;
                }
                if(currentStore.instagram) {
                    let ig = currentStore.instagram.replace('@', '').trim();
                    socialHtml += `<a href="https://instagram.com/${ig}" target="_blank" class="w-9 h-9 rounded-full bg-white/10 hover:bg-[#E1306C] border border-white/20 flex items-center justify-center text-white transition backdrop-blur-md shadow-lg"><i data-lucide="instagram" class="w-4 h-4"></i></a>`;
                }
                if(currentStore.facebook) {
                    let fb = currentStore.facebook.trim();
                    socialHtml += `<a href="https://facebook.com/${fb}" target="_blank" class="w-9 h-9 rounded-full bg-white/10 hover:bg-[#1877F2] border border-white/20 flex items-center justify-center text-white transition backdrop-blur-md shadow-lg"><i data-lucide="facebook" class="w-4 h-4"></i></a>`;
                }

                if (socialHtml !== '') {
                    socialLinksContainer.innerHTML = socialHtml;
                    socialLinksContainer.classList.remove('hidden');
                }

                const coverEl = document.getElementById('spCover');
                if(currentStore.coverUrl) { coverEl.src = currentStore.coverUrl; coverEl.classList.remove('hidden'); }
                
                const logoEl = document.getElementById('spLogo');
                const fallbackEl = document.getElementById('spLogoFallback');
                if(currentStore.logoUrl) { logoEl.src = currentStore.logoUrl; logoEl.classList.remove('hidden'); fallbackEl.classList.add('hidden'); }

                const waBtn = document.getElementById('spWhatsappBtn');
                if (currentStore.whatsapp) {
                    waBtn.classList.remove('hidden');
                    waBtn.onclick = window.contactStoreForInfo;
                }

                document.getElementById('spFollowBtn').onclick = window.toggleStoreFollow;

                const mapWrapper = document.getElementById('spMapContainerWrapper');
                if (currentStore.showLocation !== false && currentStore.lat && currentStore.lng) {
                    mapWrapper.classList.remove('hidden');
                    document.getElementById('spGoogleMapsLink').href = `https://www.google.com/maps/dir/?api=1&destination=${currentStore.lat},${currentStore.lng}`;
                    
                    setTimeout(() => {
                        spMapInstance = L.map('spLeafletMap').setView([currentStore.lat, currentStore.lng], 15);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(spMapInstance);
                        L.marker([currentStore.lat, currentStore.lng]).addTo(spMapInstance).bindPopup(`<b>${currentStore.name}</b><br>${currentStore.district}`).openPopup();
                    }, 500);
                }

                const q = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'products'), where("storeId", "==", storeId));
                const prodSnap = await getDocs(q);
                prodSnap.forEach(d => {
                    const p = d.data();
                    if(p.isActive !== false) storeProducts.push({id: d.id, ...p});
                });

                window.renderStoreProfileCategories();
                window.renderStoreProfileProducts();
                
                onAuthStateChanged(auth, (user) => {
                    if (user && !user.isAnonymous) currentUserUid = user.uid;
                    else currentUserUid = null;
                    updateFollowButtonUI();
                });

                document.getElementById('loadingIndicator').classList.add('opacity-0');
                setTimeout(() => document.getElementById('loadingIndicator').classList.add('hidden'), 300);
                lucide.createIcons();

            } catch (error) {
                console.error("Mağaza bilgileri alınırken hata:", error);
                document.getElementById('loadingIndicator').innerHTML = '<p class="text-rose-500 font-bold">Bağlantı hatası, lütfen sayfayı yenileyin.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', initStorePage);
    </script>
</body>
</html>
