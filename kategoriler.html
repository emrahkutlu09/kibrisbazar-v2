<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kıbrıs Bazar | Kategoriler</title>
    
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="theme-color" content="#ffffff">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .category-scroll::-webkit-scrollbar { width: 0px; height: 0px; }
        
        /* Mobil Alt Menü Padding */
        body { padding-bottom: 70px; }
    </style>
</head>
<body class="bg-white text-slate-900 antialiased selection:bg-orange-500 selection:text-white flex flex-col h-screen overflow-hidden">

    <!-- Arama ve Geri Dönüş Çubuğu (Sabit Üst Alan) -->
    <div class="p-3 sm:p-4 flex items-center gap-3 bg-white shrink-0 border-b border-slate-100 shadow-sm sticky top-0 z-50">
        <a href="index.html" class="p-1.5 text-slate-600 hover:text-orange-500 transition">
            <i data-lucide="arrow-left" class="w-6 h-6"></i>
        </a>
        <div class="flex-1 relative">
            <input type="text" id="catSearchInput" placeholder="Kategorilerde ara..." class="w-full bg-slate-50 border border-slate-200 rounded-full pl-10 pr-10 py-2.5 text-sm focus:outline-none focus:border-orange-500 transition font-medium">
            <i data-lucide="search" class="w-5 h-5 text-orange-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
        </div>
    </div>

    <!-- Ana Kategori Sekmeleri (Yatay Kaydırılabilir) -->
    <div class="flex items-center overflow-x-auto category-scroll border-b border-slate-200 bg-white shrink-0 transition-all duration-300" id="mainTabContainer">
        <!-- JS ile Dolacak -->
    </div>

    <!-- İçerik Alanı (Gruplar ve Alt Kategoriler) -->
    <div class="flex-1 overflow-hidden bg-white w-full max-w-[1400px] mx-auto relative" id="hamburgerMenuCategories">
        <div class="flex flex-col items-center justify-center h-full">
            <i data-lucide="loader-2" class="w-8 h-8 text-orange-500 animate-spin mb-3"></i>
            <p class="text-xs font-bold text-slate-500">Kategoriler Yükleniyor...</p>
        </div>
    </div>

    <!-- MOBİL ALT MENÜ (Kategoriler Aktif) -->
    <div id="mobileBottomNav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-[250] flex sm:hidden justify-around items-center h-16 px-1 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-500 hover:text-orange-500 gap-1 transition">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Ana Sayfa</span>
        </a>
        <!-- Kategoriler Butonu Aktif (Turuncu) -->
        <a href="kategoriler.html" class="flex flex-col items-center justify-center w-full h-full text-orange-500 gap-1 transition">
            <i data-lucide="layout-grid" class="w-5 h-5 fill-current"></i>
            <span class="text-[10px] font-bold">Kategoriler</span>
        </a>
        <a href="satici.html" class="flex flex-col items-center justify-center w-full h-full text-slate-500 hover:text-orange-500 gap-1 transition relative -top-3">
            <div class="w-12 h-12 bg-white rounded-full border border-slate-200 shadow-sm flex items-center justify-center relative">
                <div class="absolute inset-1 bg-gradient-to-tr from-orange-500 to-rose-500 rounded-full flex items-center justify-center">
                    <span class="text-white font-black text-[10px] leading-tight text-center">Bazar<br>Go</span>
                </div>
            </div>
        </a>
        <a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-500 hover:text-orange-500 gap-1 transition">
            <i data-lucide="heart" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Favorilerim</span>
        </a>
        <a href="sepet.html" class="flex flex-col items-center justify-center w-full h-full text-slate-500 hover:text-orange-500 gap-1 transition relative">
            <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Sepetim</span>
            <span id="cartCountBadgeMob" class="absolute top-1 right-2 bg-orange-600 text-white text-[9px] font-bold h-4 w-4 rounded-full flex items-center justify-center shadow-md hidden border border-white">0</span>
        </a>
    </div>

    <script type="module">
        import { db } from "./js/firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const APP_ID = 'kibris-pazar';
        let allCategories = [];

        // --- AKILLI KATEGORİ RESİM EŞLEŞTİRİCİ ---
        function getSmartCategoryImage(categoryName) {
            if (!categoryName) return 'https://placehold.co/150x150/f1f5f9/475569?text=Gorsel';
            const name = categoryName.toLowerCase();
            let keyword = "shopping,products"; 
            if (name.includes("elbise")) keyword = "dress,womens-fashion";
            else if (name.includes("tshirt") || name.includes("tişört")) keyword = "tshirt,clothing";
            else if (name.includes("gömlek")) keyword = "shirt,clothing";
            else if (name.includes("pantolon")) keyword = "pants,trousers";
            else if (name.includes("etek")) keyword = "skirt,womens-clothing";
            else if (name.includes("ayakkabı") || name.includes("sneaker")) keyword = "shoes,sneakers";
            else if (name.includes("çanta")) keyword = "bag,handbag";
            else if (name.includes("saat") || name.includes("takı")) keyword = "watch,jewelry";
            else if (name.includes("kozmetik") || name.includes("makyaj")) keyword = "makeup,cosmetics";
            else if (name.includes("elektronik") || name.includes("telefon")) keyword = "electronics,smartphone";
            else if (name.includes("bilgisayar") || name.includes("laptop")) keyword = "laptop,computer";
            else if (name.includes("beyaz eşya") || name.includes("buzdolabı")) keyword = "appliance,refrigerator";
            else if (name.includes("mobilya") || name.includes("koltuk")) keyword = "furniture,sofa";
            else if (name.includes("mutfak")) keyword = "kitchen,cookware";
            else if (name.includes("bebek") || name.includes("oyuncak")) keyword = "baby,toys";
            else if (name.includes("spor") || name.includes("fitness")) keyword = "fitness,sports";
            else if (name.includes("oto") || name.includes("araç")) keyword = "car,automotive";
            else if (name.includes("süpermarket") || name.includes("gıda")) keyword = "groceries,food";

            return `https://source.unsplash.com/150x150/?${keyword}`;
        }

        // Ana Tabları Oluşturur
        function renderMainTabs(activeId = 'all') {
            const mainCats = allCategories.filter(c => c.isMegaMenu).sort((a, b) => (a.order || 0) - (b.order || 0));
            const tabContainer = document.getElementById('mainTabContainer');
            if(!tabContainer) return;
            let html = `<button onclick="window.renderMegaMenuGrid()" id="mainTab-all" class="main-cat-tab flex-shrink-0 px-4 py-3 text-sm font-bold transition whitespace-nowrap ${activeId === 'all' ? 'text-orange-500 border-b-2 border-orange-500' : 'text-slate-500 border-b-2 border-transparent'}">Tüm Kategoriler</button>`;
            mainCats.forEach(main => {
                const isActive = main.id === activeId ? 'text-orange-500 border-b-2 border-orange-500' : 'text-slate-500 border-b-2 border-transparent';
                html += `<button onclick="window.openMainCategoryDetails('${main.id}', '${main.name}')" id="mainTab-${main.id}" class="main-cat-tab flex-shrink-0 px-4 py-3 text-sm font-bold transition whitespace-nowrap ${isActive}">${main.name}</button>`;
            });
            tabContainer.innerHTML = html;
        }

        // Ana Sayfa (Grid) Görünümü
        window.renderMegaMenuGrid = () => {
            const container = document.getElementById('hamburgerMenuCategories');
            if(!container) return;
            renderMainTabs('all');
            const mainCats = allCategories.filter(c => c.isMegaMenu).sort((a, b) => (a.order || 0) - (b.order || 0));
            let html = `
                <div class="w-full h-full p-4 overflow-y-auto category-scroll pb-24 bg-slate-50">
                    <div class="bg-gradient-to-r from-orange-100 to-orange-200 rounded-xl p-4 text-orange-900 flex items-center justify-between shadow-sm mb-4">
                        <div><h3 class="text-sm font-bold">Ne Arıyorsunuz?</h3><span class="text-[10px] mt-0.5 block opacity-80">Binlerce ürün arasından seçiminizi yapın</span></div>
                        <div class="w-12 h-12 flex items-center justify-center transform -rotate-12"><i data-lucide="layout-grid" class="w-8 h-8 text-orange-500"></i></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
            `;
            mainCats.forEach(main => {
                const img = main.image && main.image.trim() !== '' ? main.image : getSmartCategoryImage(main.name);
                html += `
                    <button onclick="window.openMainCategoryDetails('${main.id}', '${main.name}')" class="flex flex-row items-center justify-between pl-3 pr-0 py-0 rounded-xl bg-slate-100/80 hover:bg-slate-200 border border-transparent transition group text-left h-20 overflow-hidden relative">
                        <span class="text-xs font-bold text-slate-800 z-10 w-1/2 leading-tight">${main.name}</span>
                        <img src="${img}" alt="${main.name}" loading="lazy" class="h-full w-auto max-w-[50%] object-cover absolute right-0">
                    </button>
                `;
            });
            html += `</div></div>`;
            container.innerHTML = html;
            lucide.createIcons();
        };

        // Kategori Detay (Sol Menü / Sağ İçerik) Görünümü
        window.openMainCategoryDetails = (mainId, mainName) => {
            const container = document.getElementById('hamburgerMenuCategories');
            renderMainTabs(mainId);
            const groups = allCategories.filter(c => c.parentId === mainId && c.isGroupTitle).sort((a, b) => (a.order || 0) - (b.order || 0));
            
            let html = `<div class="flex w-full h-full pb-16"><div class="w-[30%] sm:w-[25%] bg-slate-50 flex flex-col overflow-y-auto category-scroll pb-24 border-r border-slate-100" id="groupTabsContainer">`;
            
            groups.forEach((grp, idx) => {
                const isActive = idx === 0 ? 'bg-white text-orange-600 font-bold border-l-4 border-orange-500' : 'text-slate-600 font-medium hover:bg-slate-100 border-l-4 border-transparent';
                html += `<button onclick="window.switchGroupTab('${grp.id}', this)" class="group-tab-btn text-left px-3 py-4 text-[11px] transition ${isActive}">${grp.name}</button>`;
            });
            
            html += `</div><div class="w-[70%] sm:w-[75%] p-3 sm:p-4 overflow-y-auto category-scroll bg-white pb-24" id="groupContentArea">`;
            
            groups.forEach((grp, idx) => {
                const isHidden = idx === 0 ? '' : 'hidden';
                const subs = allCategories.filter(c => c.parentId === grp.id).sort((a, b) => (a.order || 0) - (b.order || 0));
                html += `<div id="groupPane-${grp.id}" class="group-pane ${isHidden} space-y-4 pb-28"><div class="grid grid-cols-3 sm:grid-cols-4 gap-x-2 gap-y-4">
                        <button onclick="window.selectCategory('${mainId}', '', 'Tüm ${grp.name}', '${mainName}')" class="flex flex-col items-center group text-center">
                            <div class="w-[70px] h-[70px] sm:w-20 sm:h-20 rounded-2xl bg-orange-50 overflow-hidden mb-1 flex items-center justify-center border border-orange-100">
                                <div class="grid grid-cols-2 gap-1 opacity-60">
                                    <div class="w-2.5 h-2.5 bg-orange-500 rounded-[3px]"></div>
                                    <div class="w-2.5 h-2.5 bg-orange-500 rounded-[3px]"></div>
                                    <div class="w-2.5 h-2.5 bg-orange-500 rounded-[3px]"></div>
                                    <div class="w-2.5 h-2.5 bg-orange-500 rounded-[3px] flex items-center justify-center text-white"><i data-lucide="chevron-right" class="w-2.5 h-2.5"></i></div>
                                </div>
                            </div>
                            <span class="text-[10px] font-medium text-slate-700 leading-tight w-full truncate">Tümünü Gör</span>
                        </button>
                `;
                subs.forEach(sub => {
                    const subImg = sub.image && sub.image.trim() !== '' ? sub.image : getSmartCategoryImage(sub.name);
                    html += `
                        <button onclick="window.selectCategory('${mainId}', '${sub.slug}', '${sub.name}', '${mainName}')" class="flex flex-col items-center group text-center">
                            <div class="w-[70px] h-[70px] sm:w-20 sm:h-20 rounded-2xl bg-white border border-slate-100 overflow-hidden mb-1 p-1 shadow-sm transition">
                                <img src="${subImg}" alt="${sub.name}" loading="lazy" class="w-full h-full object-contain">
                            </div>
                            <span class="text-[10px] font-medium text-slate-700 leading-tight w-full break-words line-clamp-2">${sub.name}</span>
                        </button>
                    `;
                });
                html += `</div></div>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
            lucide.createIcons();
        };

        // Grup (Sol Menü) Geçişi
        window.switchGroupTab = (groupId, btnElement) => {
            document.querySelectorAll('.group-pane').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.group-tab-btn').forEach(b => { 
                b.classList.remove('bg-white', 'text-orange-600', 'font-bold', 'border-orange-500'); 
                b.classList.add('text-slate-600', 'font-medium', 'hover:bg-slate-100', 'border-transparent'); 
            });
            
            document.getElementById(`groupPane-${groupId}`).classList.remove('hidden');
            btnElement.classList.remove('text-slate-600', 'font-medium', 'hover:bg-slate-100', 'border-transparent');
            btnElement.classList.add('bg-white', 'text-orange-600', 'font-bold', 'border-orange-500');
        };

        // BİR KATEGORİ SEÇİLDİĞİNDE -> INDEX'E YÖNLENDİR
        window.selectCategory = (mainCatId, subCatSlug, subCatName, mainCatName) => {
            const filterData = {
                mainCatId: mainCatId,
                subCatSlug: subCatSlug,
                subCatName: subCatName,
                mainCatName: mainCatName
            };
            localStorage.setItem('kibris_active_category', JSON.stringify(filterData));
            window.location.href = 'index.html';
        };

        // --- KATEGORİ İÇİ ARAMA İŞLEVİ (YENİ EKLENDİ) ---
        const setupCategorySearch = () => {
            const catSearchInput = document.getElementById('catSearchInput');
            if(catSearchInput) {
                catSearchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    const container = document.getElementById('hamburgerMenuCategories');
                    const tabsContainer = document.getElementById('mainTabContainer');
                    
                    if (query.length === 0) {
                        tabsContainer.classList.remove('hidden');
                        window.renderMegaMenuGrid();
                        return;
                    }
                    
                    // Arama yapılırken üst tabları gizle
                    tabsContainer.classList.add('hidden');
                    
                    // Alt kategoriler (isMegaMenu ve isGroupTitle olmayanlar) arasından eşleşme bul
                    const matchingSubs = allCategories.filter(c => 
                        !c.isMegaMenu && !c.isGroupTitle && c.name.toLowerCase().includes(query)
                    );
                    
                    // Eşleşme yoksa
                    if (matchingSubs.length === 0) {
                        container.innerHTML = `
                            <div class="flex flex-col items-center justify-center h-full text-slate-500 py-20 bg-slate-50">
                                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center border border-slate-200 mb-3 shadow-sm">
                                    <i data-lucide="search-x" class="w-8 h-8 text-slate-400"></i>
                                </div>
                                <p class="text-sm font-bold text-slate-800">Kategori bulunamadı.</p>
                                <p class="text-xs text-slate-500 mt-1">Farklı bir kelimeyle tekrar arayın.</p>
                            </div>
                        `;
                        lucide.createIcons();
                        return;
                    }
                    
                    // Eşleşen kategorileri listele
                    let html = `<div class="p-4 bg-slate-50 h-full overflow-y-auto pb-24"><div class="bg-white rounded-2xl border border-slate-200 overflow-hidden divide-y divide-slate-100 shadow-sm">`;
                    
                    matchingSubs.forEach(sub => {
                        let mainCatId = '';
                        let mainCatName = '';
                        let path = '';
                        
                        // Hangi ana kategori ve grubun altında olduğunu bul
                        if (sub.parentId) {
                            const parent = allCategories.find(c => c.id === sub.parentId);
                            if (parent) {
                                if (parent.isMegaMenu) {
                                    mainCatId = parent.id;
                                    mainCatName = parent.name;
                                    path = parent.name;
                                } else {
                                    const grandParent = allCategories.find(c => c.id === parent.parentId);
                                    if (grandParent) {
                                        mainCatId = grandParent.id;
                                        mainCatName = grandParent.name;
                                        path = `${grandParent.name} > ${parent.name}`;
                                    } else {
                                        path = parent.name;
                                    }
                                }
                            }
                        }
                        
                        const img = sub.image && sub.image.trim() !== '' ? sub.image : getSmartCategoryImage(sub.name);
                        
                        html += `
                            <button onclick="window.selectCategory('${mainCatId}', '${sub.slug}', '${sub.name}', '${mainCatName}')" class="w-full flex items-center justify-between p-3 sm:p-4 hover:bg-orange-50 transition text-left group">
                                <div class="flex items-center gap-3 sm:gap-4">
                                    <img src="${img}" class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl object-cover bg-slate-100 border border-slate-200 shrink-0">
                                    <div>
                                        <h4 class="text-xs sm:text-sm font-bold text-slate-800 group-hover:text-orange-600 transition">${sub.name}</h4>
                                        <p class="text-[9px] sm:text-[10px] text-slate-400 font-medium mt-0.5">${path}</p>
                                    </div>
                                </div>
                                <div class="w-8 h-8 rounded-full bg-slate-50 group-hover:bg-orange-100 flex items-center justify-center transition shrink-0">
                                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 group-hover:text-orange-500"></i>
                                </div>
                            </button>
                        `;
                    });
                    
                    html += `</div></div>`;
                    container.innerHTML = html;
                    lucide.createIcons();
                });
            }
        };

        // Sepet Sayısını Güncelle
        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('cart_items_v2')) || [];
            let totalQty = 0;
            cart.forEach(item => totalQty += item.quantity);
            const badgeMob = document.getElementById('cartCountBadgeMob');
            if(badgeMob) { 
                badgeMob.innerText = totalQty; 
                if(totalQty > 0) badgeMob.classList.remove('hidden'); 
                else badgeMob.classList.add('hidden'); 
            }
        }

        async function initPage() {
            updateCartBadge();
            
            try {
                // Firebase'den Tüm Kategorileri Çek
                const catSnap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'categories'));
                allCategories = [];
                catSnap.forEach(doc => allCategories.push({ id: doc.id, ...doc.data() }));
                
                // Arama Sistemini Kur
                setupCategorySearch();

                // İlk Açılışta Ana Kategori Grid'ini Çiz
                window.renderMegaMenuGrid();
            } catch (error) {
                console.error("Kategoriler yüklenirken hata:", error);
                document.getElementById('hamburgerMenuCategories').innerHTML = '<div class="p-8 text-center text-rose-500 font-bold">Kategoriler yüklenemedi. Lütfen sayfayı yenileyin.</div>';
            }
            
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
